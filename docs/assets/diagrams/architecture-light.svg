<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1048" width="920" height="1048" role="img">
<title>m1nd architecture at a glance</title>
<desc>A layer stack. Coding agent hosts across the top, twenty two of them, all speak MCP over stdio or HTTP through one contract of 48 tools. That reaches a single served owner, one process on one port, which routes every session by repository root to the brain that covers it. Each brain holds its own graph, memory and persistence, and lives on disk inside the repository it covers. Nothing leaves the machine.</desc>
<rect x="0" y="0" width="920" height="1048" fill="#ECEDE8"/>
<text x="40" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#14181C" text-anchor="start">architecture</text>
<text x="40" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A6169" text-anchor="start">hosts speak MCP to one served owner; the owner routes each session to the brain</text>
<text x="40" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A6169" text-anchor="start">that covers its repository root</text>
