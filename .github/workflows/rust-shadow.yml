# Measurement only. Never a required check and never automatic on a PR or main push.
name: Rust nextest shadow (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-nextest-shadow
  cancel-in-progress: false

jobs:
  nextest-shadow:
    name: nextest shadow (observational)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: nextest-shadow
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - name: Run the suite under nextest, timed
        run: cargo nextest run --profile shadow --locked --workspace --all-targets
