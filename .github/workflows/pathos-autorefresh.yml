name: pathos-autorefresh-proposal

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/internal/PATHOS.md"
      - "docs/PATHOS.md"
      - "PATHOS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pathos-autorefresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare inert PATHOS PR artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Prove generated commit metadata remains inert
        run: node --test .github/scripts/pathos-autorefresh.test.mjs
      - name: Generate the local PATHOS proposal
        run: node .github/scripts/pathos-autorefresh.mjs
      - name: Seal a review-only PR preparation artifact
        shell: bash
        run: |
          mkdir -p pathos-pr-prep
          git diff --binary -- \
            docs/internal/PATHOS.md docs/PATHOS.md PATHOS.md \
            > pathos-pr-prep/PATHOS.patch
          if git diff --quiet -- docs/internal/PATHOS.md docs/PATHOS.md PATHOS.md; then
            STATUS="NO_CHANGES"
          else
            STATUS="CHANGES_PROPOSED"
          fi
          PATHOS_PROPOSAL_STATUS="${STATUS}" node - <<'NODE'
          const fs = require("node:fs");
          const receipt = {
            schema: "m1nd-pathos-pr-prep-v1",
            source_commit: process.env.GITHUB_SHA,
            status: process.env.PATHOS_PROPOSAL_STATUS,
            authority: "REVIEW_ONLY_NO_COMMIT_NO_PUSH",
          };
          fs.writeFileSync(
            "pathos-pr-prep/RECEIPT.json",
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          NODE
          echo "PATHOS proposal status: ${STATUS}" >> "${GITHUB_STEP_SUMMARY}"
          echo "No commit, push, PAT, branch bypass, or repository mutation was attempted." >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pathos-pr-prep-${{ github.sha }}
          path: pathos-pr-prep/
          if-no-files-found: error
          retention-days: 14
