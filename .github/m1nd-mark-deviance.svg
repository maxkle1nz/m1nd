<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="m1nd-mark-title">
  <title id="m1nd-mark-title">m1nd — a DEViance Intelligence code graph</title>
  <!-- DEViance form grammar: carbon field, bone structure, one signal. No glow, no gradient. -->
  <rect x="0" y="0" width="1200" height="360" fill="#050505"/>
  <!-- Glyph: a framed graph; the one violet edge leaves the frame. Violet lives only here. -->
  <g transform="translate(153,59)">
    <line x1="121" y1="121" x2="20" y2="20" stroke="#F0EDE4" stroke-width="4"/>
    <line x1="121" y1="121" x2="77" y2="222" stroke="#F0EDE4" stroke-width="4"/>
    <line x1="121" y1="121" x2="160.5" y2="160.5" stroke="#F0EDE4" stroke-width="4"/>
    <rect x="52.5" y="52.5" width="136" height="136" fill="none" stroke="#F0EDE4" stroke-width="13"/>
    <line x1="121" y1="121" x2="222" y2="87" stroke="#8B5CF6" stroke-width="9"/>
    <rect x="9" y="9" width="22" height="22" fill="#F0EDE4"/>
    <rect x="66" y="211" width="22" height="22" fill="#F0EDE4"/>
    <rect x="154" y="154" width="13" height="13" fill="#F0EDE4"/>
    <rect x="211" y="76" width="22" height="22" fill="#F0EDE4"/>
    <rect x="92.5" y="92.5" width="57" height="57" fill="#8B5CF6"/>
  </g>
  <!-- Wordmark m1nd, built from the stroke grid (22 / x-height 120 / ascender 170). -->
  <g transform="translate(96,35)" fill="#F0EDE4">
    <rect x="400" y="110" width="150" height="22"/>
    <rect x="400" y="110" width="22" height="120"/>
    <rect x="464" y="110" width="22" height="120"/>
    <rect x="528" y="110" width="22" height="120"/>
    <rect x="580" y="60" width="22" height="22"/>
    <rect x="602" y="60" width="22" height="170"/>
    <rect x="654" y="110" width="86" height="22"/>
    <rect x="654" y="110" width="22" height="120"/>
    <rect x="718" y="110" width="22" height="120"/>
    <rect x="770" y="110" width="22" height="120"/>
    <rect x="770" y="110" width="86" height="22"/>
    <rect x="770" y="208" width="86" height="22"/>
    <rect x="834" y="60" width="22" height="170"/>
    <!-- Proof ruler 01-05: the fifth mark breaks the text boundary. -->
    <g fill="#85847F">
      <rect x="400" y="262" width="57" height="4"/>
      <rect x="492" y="262" width="57" height="4"/>
      <rect x="584" y="262" width="57" height="4"/>
      <rect x="676" y="262" width="57" height="4"/>
      <rect x="768" y="262" width="182" height="4"/>
    </g>
  </g>
</svg>
